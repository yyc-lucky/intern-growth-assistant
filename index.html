<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AI 实习成长助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand:'#2E6F66', branddeep:'#22544C', sage:'#8FBFA8', lgreen:'#D3E8DC', mist:'#EAF4EF',
        blueg:'#4E86A8', skyb:'#B7D6E4', lakeb:'#DCEBF2', cloudb:'#EDF5F9',
        teal:'#3E8E86', lteal:'#7FBCB4', mint:'#C3E2D6', palteal:'#E6F3F0',
        bg:'#F6FAF8', card:'#FFFFFF', subbg:'#EEF4F2',
        t1:'#1B2D2B', t2:'#5A6D6A', t3:'#8B9C98', line:'#E7EFEB', disabled:'#C8D4CF'
      },
      borderRadius:{ xs:'6px', sm:'8px', md:'10px', lg:'12px', xl:'16px', xxl:'20px' },
      boxShadow:{
        soft:'0 1px 2px rgba(28,48,45,0.03)',
        card:'0 1px 2px rgba(28,48,45,0.03), 0 10px 26px -16px rgba(28,48,45,0.20)',
        lift:'0 14px 34px -16px rgba(28,48,45,0.30)'
      }
    }
  }
}
</script>
<style>
  *{ -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:radial-gradient(900px 460px at 50% -10%, #E6F3EE 0%, #F6FAF8 48%, #F2F8FA 100%);
    background-attachment:fixed; color:#1B2D2B;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  }
  .press{ transition:opacity .15s ease, transform .15s ease; }
  .press:active{ opacity:.7; transform:scale(.99); }
  .grad-hero{ background-image:linear-gradient(135deg,#2E6F66 0%,#357C7C 46%,#4E86A8 100%); }
  .grad-soft{ background-image:linear-gradient(135deg,#E9F4EF 0%,#EDF6FA 100%); }
  .grad-ai{ background-image:linear-gradient(135deg,#E6F3F0 0%,#EAF3F9 100%); }
  .num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }

  /* ---------- 版式 ---------- */
  .h1{ font-size:22px; line-height:1.28; font-weight:600; letter-spacing:-0.02em; color:#1B2D2B; }
  .sub{ font-size:11.5px; line-height:1.6; color:#8B9C98; margin-top:5px; letter-spacing:.01em; }
  .sec{ display:flex; align-items:baseline; justify-content:space-between; padding:0 20px; margin:26px 0 10px; }
  .sec h2{ font-size:14.5px; font-weight:600; letter-spacing:-0.01em; color:#1B2D2B; }
  .sec .more{ font-size:11px; color:#8B9C98; }
  .card{ background:#fff; border:1px solid #E7EFEB; border-radius:16px; box-shadow:0 1px 2px rgba(28,48,45,.03), 0 10px 26px -16px rgba(28,48,45,.20); }
  .divide-line > * + *{ border-top:1px solid #EFF4F2; }

  /* ---------- 导航 ---------- */
  .tab-btn{ color:#8B9C98; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; flex:1; padding:7px 0 6px; transition:color .18s ease; }
  .tab-btn .nav-ico{ width:40px; height:25px; border-radius:9px; display:flex; align-items:center; justify-content:center; transition:background-color .2s ease, color .2s ease; }
  .tab-btn.text-brand .nav-ico{ background:#E9F4F0; }
  .tab-btn .nav-label{ font-size:10px; letter-spacing:.02em; }
  .tab-btn.text-brand .nav-label{ font-weight:500; }
  .fab{ width:48px; height:48px; border-radius:17px; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 22px -8px rgba(46,111,102,.55); }

  /* ---------- 控件 ---------- */
  .field{ width:100%; background:#F6FAF8; border:1px solid #E7EFEB; border-radius:11px; padding:10px 12px; font-size:13px; line-height:1.6; outline:none; color:#1B2D2B; transition:border-color .16s ease, background-color .16s ease; }
  .field::placeholder{ color:#A9B7B3; }
  .field:focus{ border-color:#8FBFA8; background:#fff; box-shadow:0 0 0 3px rgba(143,191,168,.14); }
  .chip{ font-size:11px; padding:6px 11px; border-radius:999px; border:1px solid #E7EFEB; background:#fff; color:#5A6D6A; white-space:nowrap; transition:.16s ease; }
  .chip.on{ background:#2E6F66; border-color:#2E6F66; color:#fff; font-weight:500; }
  .icon-btn{ width:36px; height:36px; border-radius:12px; background:#fff; border:1px solid #E7EFEB; display:flex; align-items:center; justify-content:center; color:#5A6D6A; }
  .btn-primary{ background:#2E6F66; color:#fff; border-radius:12px; font-size:13.5px; font-weight:500; height:46px; display:flex; align-items:center; justify-content:center; }
  .btn-primary:active{ background:#22544C; }
  .btn-soft{ background:#EAF4EF; color:#2E6F66; border-radius:12px; font-size:12.5px; font-weight:500; height:40px; display:flex; align-items:center; justify-content:center; }

  details>summary{list-style:none;cursor:pointer}
  details>summary::-webkit-details-marker{display:none}
  ::-webkit-scrollbar{display:none}
  input,textarea,select{font-family:inherit}
  .sw{width:40px;height:23px;border-radius:9999px;position:relative;transition:.2s;flex-shrink:0}
  .sw i{position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:9999px;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .sw.on{background:#2E6F66}.sw.on i{left:19.5px}
  .sw.off{background:#DDE3DA}
  .line-clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .fade-in{ animation:fadeIn .22s ease both; }
  @keyframes fadeIn{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .sheet-up{ animation:sheetUp .28s cubic-bezier(.32,.72,.36,1) both; }
  @keyframes sheetUp{ from{transform:translateY(100%)} to{transform:none} }
  .typing span{ display:inline-block;width:5px;height:5px;margin-right:3px;border-radius:9999px;background:#8DBEAC;animation:blink 1.2s infinite }
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @media print{
    body{ background:#fff; }
    #tabbar, #toast, #subpage, #sheetHost, #aiHost, #confirmHost{ display:none !important; }
    .page{ display:block !important; }
    #page-timeline, #page-add, #page-growth, #page-me{ display:none !important; }
    .shadow-card, .shadow-soft{ box-shadow:none !important; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body class="bg-[#EDF3F1] min-h-screen flex justify-center">

<div id="app" class="w-full max-w-[400px] bg-bg min-h-screen relative flex flex-col shadow-soft">
  <main id="pages" class="flex-1 pb-24">
    <section id="page-home" class="page"></section>
    <section id="page-timeline" class="page hidden"></section>
    <section id="page-add" class="page hidden"></section>
    <section id="page-growth" class="page hidden"></section>
    <section id="page-me" class="page hidden"></section>
  </main>

  <nav id="tabbar" class="fixed inset-x-0 bottom-0 mx-auto w-full max-w-[400px] bg-white/95 backdrop-blur-xl border-t border-line z-30" style="padding-bottom:env(safe-area-inset-bottom)">
    <div class="flex items-stretch">
      <button class="tab-btn press" data-tab="home" aria-label="首页">
        <span class="nav-ico"><svg class="w-[20px] h-[20px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-9.5z"/></svg></span>
        <span class="nav-label">首页</span>
      </button>
      <button class="tab-btn press relative" data-tab="timeline" aria-label="记录">
        <span id="navDot" class="hidden absolute top-1 right-[22%] min-w-[16px] h-[16px] px-1 rounded-full bg-[#B96A45] text-white text-[9px] leading-[16px] text-center num">0</span>
        <span class="nav-ico"><svg class="w-[20px] h-[20px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3.5h12v17H6z"/><path d="M9 8.5h6M9 12.5h6M9 16.5h3.5"/></svg></span>
        <span class="nav-label">记录</span>
      </button>
      <button class="tab-btn press !gap-0" data-tab="add" aria-label="新增记录">
        <span class="fab grad-hero text-white -mt-5 mb-1">
          <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
        </span>
        <span class="nav-label">记一笔</span>
      </button>
      <button class="tab-btn press" data-tab="growth" aria-label="成长">
        <span class="nav-ico"><svg class="w-[20px] h-[20px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 18.5V11M10 18.5V6M16 18.5v-5M21 18.5H3"/></svg></span>
        <span class="nav-label">成长</span>
      </button>
      <button class="tab-btn press" data-tab="me" aria-label="我的">
        <span class="nav-ico"><svg class="w-[20px] h-[20px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8.2" r="3.3"/><path d="M5.2 19.8c0-3.5 3.1-5.5 6.8-5.5s6.8 2 6.8 5.5"/></svg></span>
        <span class="nav-label">我的</span>
      </button>
    </div>
  </nav>
</div>

<!-- 二级页面 -->
<div id="subpage" class="hidden fixed inset-0 z-40">
  <div class="w-full max-w-[400px] mx-auto h-full bg-bg flex flex-col shadow-soft">
    <header class="h-12 shrink-0 bg-white/95 backdrop-blur border-b border-line flex items-center px-2">
      <button onclick="backSub()" class="press w-9 h-9 flex items-center justify-center rounded-full text-t1">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <p id="subTitle" class="flex-1 text-center text-[15px] font-medium text-t1 truncate px-1"></p>
      <div id="subActions" class="w-9 h-9 flex items-center justify-end"></div>
    </header>
    <div id="subBody" class="flex-1 overflow-y-auto"></div>
  </div>
</div>

<!-- 通用底部抽屉 -->
<div id="sheetHost" class="hidden fixed inset-0 z-50">
  <div class="absolute inset-0 bg-black/30" onclick="closeSheet()"></div>
  <div class="absolute inset-x-0 bottom-0 mx-auto w-full max-w-[400px] bg-bg rounded-t-2xl max-h-[88vh] flex flex-col sheet-up">
    <div class="shrink-0 h-12 px-4 bg-white rounded-t-2xl border-b border-line flex items-center justify-between">
      <p id="sheetTitle" class="text-[15px] font-semibold text-t1 truncate pr-3"></p>
      <button onclick="closeSheet()" class="press w-7 h-7 rounded-full bg-subbg text-t2 flex items-center justify-center text-[13px] leading-none">✕</button>
    </div>
    <div id="sheetBody" class="flex-1 overflow-y-auto"></div>
    <div id="sheetFoot" class="shrink-0 bg-white border-t border-line" style="padding-bottom:env(safe-area-inset-bottom)"></div>
  </div>
</div>

<!-- 确认框 -->
<div id="confirmHost" class="hidden fixed inset-0 z-[70] flex items-center justify-center px-8">
  <div class="absolute inset-0 bg-black/35" onclick="closeConfirm()"></div>
  <div class="relative w-full max-w-[300px] bg-white rounded-2xl overflow-hidden fade-in">
    <div class="px-5 pt-5 pb-4 text-center">
      <p id="cfTitle" class="text-[15px] font-semibold text-t1"></p>
      <p id="cfMsg" class="text-[12px] text-t2 mt-2 leading-relaxed"></p>
    </div>
    <div id="cfFoot" class="flex border-t border-line"></div>
  </div>
</div>

<!-- AI 助手 -->
<div id="aiHost" class="hidden fixed inset-0 z-[60]">
  <div class="absolute inset-0 bg-black/30" onclick="closeAI()"></div>
  <div class="absolute inset-x-0 bottom-0 mx-auto w-full max-w-[400px] h-[82vh] bg-bg rounded-t-2xl flex flex-col sheet-up">
    <div class="shrink-0 h-12 px-4 bg-white rounded-t-2xl border-b border-line flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="w-6 h-6 rounded-lg bg-mist text-brand flex items-center justify-center">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.8L12 16.4l-1.8-4.9L5 9.7l5.2-1.8L12 3z"/></svg>
        </span>
        <p class="text-[15px] font-semibold text-t1">AI 助手</p>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="clearChat()" class="press text-[11px] text-t3 px-2 py-1">清空</button>
        <button onclick="closeAI()" class="press w-7 h-7 rounded-full bg-subbg text-t2 flex items-center justify-center text-[13px]">✕</button>
      </div>
    </div>
    <div class="shrink-0 px-3 pt-2.5 pb-2 flex gap-2 overflow-x-auto bg-white border-b border-line" id="aiChips"></div>
    <div id="chatList" class="flex-1 overflow-y-auto px-3 py-3 space-y-3"></div>
    <div class="shrink-0 bg-white border-t border-line p-2.5 flex items-end gap-2" style="padding-bottom:calc(10px + env(safe-area-inset-bottom))">
      <textarea id="chatInput" rows="1" placeholder="问问 AI，比如：帮我把这周记录写成周报" class="flex-1 max-h-24 bg-bg rounded-lg px-3 py-2.5 text-[13px] outline-none border border-line focus:border-lteal resize-none"></textarea>
      <button onclick="sendChat()" id="chatSend" class="press w-9 h-9 shrink-0 rounded-lg bg-brand text-white flex items-center justify-center" aria-label="发送">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2.5-6L4 12z"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="toast" class="fixed top-4 inset-x-0 z-[80] flex justify-center pointer-events-none px-6"></div>

<script>
/* =========================================================
   数据层：全部数据来自用户输入，仅存本机 localStorage
   ========================================================= */
const $ = id => document.getElementById(id);
const KEY = 'aiintern.v2';
const TYPES = ['工作','学习','心得','灵感','生活'];
const TYPE_CLS = {
  '工作':'bg-mist text-brand', '学习':'bg-cloudb text-blueg', '心得':'bg-palteal text-teal',
  '灵感':'bg-[#E8F4F6] text-[#2F7F8C]', '生活':'bg-[#EDF1F6] text-[#5A708C]'
};
const STATUS_CLS = {
  '整理中':'bg-cloudb text-blueg', '待确认':'bg-[#E8F4F6] text-[#2F7F8C]',
  '已完成':'bg-mist text-brand', '失败':'bg-[#F4EFEE] text-[#8C6A64]'
};
const ABILITIES = ['信息整理','信息检索','书面表达','沟通协作','数据处理','逻辑分析','法律检索','文本审阅','项目管理','细致耐心'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const firstChar = s => [...String(s ?? '').trim()][0] || '?';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const pad = n => String(n).padStart(2,'0');
const iso = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDate = v => { if(!v) return ''; const p = String(v).split('-'); return p.length===3 ? `${+p[1]}月${+p[2]}日` : v; };
const fmtDateFull = v => { if(!v) return ''; const p = String(v).split('-'); return p.length===3 ? `${p[0]}年${+p[1]}月${+p[2]}日` : v; };
const weekdayName = v => { const d = new Date(v+'T00:00:00'); return isNaN(d) ? '' : '周' + '日一二三四五六'[d.getDay()]; };
const daysBetween = (a,b) => {
  const d1 = new Date((a||'')+'T00:00:00'), d2 = new Date((b||'')+'T00:00:00');
  if(isNaN(d1.getTime()) || isNaN(d2.getTime())) return 0;
  return Math.max(0, Math.round((d2 - d1)/86400000));
};

let memStore = null;
function blankDB(){
  return {
    profile:{ avatar:'', name:'', school:'', major:'', degree:'', grad:'', city:'', email:'', phone:'', target:'', bio:'', skills:[] },
    internships:[], records:[], materials:[], knowledge:[], reports:[], interviews:[], trash:[],
    settings:{ privacy:'仅自己可见', tone:'平衡（忠于记录）', remind:true, weekly:true, confirmFirst:true },
    chat:[], created: iso()
  };
}
function loadDB(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e) { raw = memStore; }
  let d = null;
  if(raw){ try { d = JSON.parse(raw); } catch(e) {} }
  const b = blankDB();
  if(!d || typeof d !== 'object') return b;
  const arr = k => Array.isArray(d[k]) ? d[k] : [];
  const out = {
    ...b, ...d,
    profile: { ...b.profile, ...(d.profile || {}) },
    settings: { ...b.settings, ...(d.settings || {}) },
    internships: arr('internships'), records: arr('records'), materials: arr('materials'),
    knowledge: arr('knowledge'), reports: arr('reports'), interviews: arr('interviews'),
    trash: arr('trash'), chat: arr('chat')
  };
  /* 旧数据兼容：过程 → 行动 Action，补上情境 Situation */
  out.records.forEach(r => {
    if(r.struct){
      if(r.struct.situation == null) r.struct.situation = '';
      if(r.struct.action == null) r.struct.action = r.struct.process || '';
    }
    if(r.ai){
      if(r.ai.situation == null) r.ai.situation = '';
      if(r.ai.action == null) r.ai.action = r.ai.process || '';
      if(r.ai.qkey == null) r.ai.qkey = r.ai.question ? 'result' : '';
      const bad = /^记录中提到「(.+?)」，?请核对是否为真实成果?$/.exec(String(r.ai.result || '').trim());
      if(bad){ r.ai.suggest = { key:'result', text:bad[1], at:Date.now() }; r.ai.result = ''; }
    }
  });
  out.materials.forEach(m => {
    if(m.situation == null) m.situation = '';
    if(m.action == null) m.action = m.process || '';
    const bad = /^记录中提到「(.+?)」，?请核对是否为真实成果?$/.exec(String(m.result || '').trim());
    if(bad) m.result = '';
  });
  return out;
}
let DB = loadDB();
function saveDB(){
  const s = JSON.stringify(DB);
  try { localStorage.setItem(KEY, s); } catch(e) { memStore = s; }
}

/* 刷新：重绘当前 Tab 与当前子页 */
function refresh(){
  saveDB();
  renderTab(currentTab);
  if(currentSub) renderSub();
  renderNavBadge();
}
function toast(msg){
  const box = $('toast');
  box.innerHTML = `<div class="bg-[#1E302E]/95 text-white text-[12px] px-3.5 py-2 rounded-lg shadow-lg max-w-[320px] text-center fade-in leading-relaxed">${esc(msg)}</div>`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { box.innerHTML = ''; }, 2300);
}

/* 确认框 */
let cfCb = null;
function ask(title, msg, okText, cb, danger){
  $('cfTitle').textContent = title;
  $('cfMsg').textContent = msg;
  $('cfFoot').innerHTML = `
    <button onclick="closeConfirm()" class="press flex-1 h-11 text-[13px] text-t2 border-r border-line">取消</button>
    <button id="cfOk" class="press flex-1 h-11 text-[13px] font-medium ${danger?'text-[#8C6A64]':'text-brand'}">${esc(okText||'确定')}</button>`;
  cfCb = cb;
  $('cfOk').onclick = () => { const fn = cfCb; closeConfirm(); if(fn) fn(); };
  $('confirmHost').classList.remove('hidden');
}
function closeConfirm(){ $('confirmHost').classList.add('hidden'); cfCb = null; }

/* =========================================================
   通用抽屉 / 子页 / Tab
   ========================================================= */
function openSheet(title, body, foot){
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = body;
  $('sheetFoot').innerHTML = foot || '';
  $('sheetHost').classList.remove('hidden');
}
function closeSheet(){
  $('sheetHost').classList.add('hidden');
  $('sheetBody').innerHTML = '';
  $('sheetFoot').innerHTML = '';
}
let currentTab = 'home';
let currentSub = null;
let subStack = [];
const SUB = {};

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  $('page-' + tab).classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle('text-brand', on);
    b.classList.toggle('text-t3', !on);
  });
  renderTab(tab);
  window.scrollTo({ top: 0 });
  document.documentElement.scrollTop = 0;
}
function renderTab(tab){
  if(tab === 'home') renderHome();
  else if(tab === 'timeline') renderTimeline();
  else if(tab === 'add') renderAdd();
  else if(tab === 'growth') renderGrowth();
  else if(tab === 'me') renderMe();
}
function openSub(key, param){
  const def = SUB[key];
  if(def && def.onOpen) def.onOpen(param);
  subStack.push({ key, param });
  currentSub = key;
  $('subpage').classList.remove('hidden');
  renderSub();
}
function replaceSub(key, param){
  subStack[subStack.length-1] = { key, param };
  currentSub = key;
  renderSub();
}
function backSub(){
  subStack.pop();
  if(!subStack.length){ closeSub(); return; }
  const top = subStack[subStack.length-1];
  currentSub = top.key;
  renderSub();
}
function closeSub(){ subStack = []; currentSub = null; $('subpage').classList.add('hidden'); }
function subParam(){ const top = subStack[subStack.length-1]; return top ? top.param : null; }
function renderSub(){
  const def = SUB[currentSub];
  if(!def) return;
  $('subTitle').textContent = typeof def.title === 'function' ? def.title(subParam()) : def.title;
  $('subActions').innerHTML = def.actions ? def.actions(subParam()) : '';
  $('subBody').innerHTML = def.body(subParam());
  if(def.after) def.after(subParam());
}

/* =========================================================
   计算与派生数据
   ========================================================= */
const Q = {
  activeInternship(){ return DB.internships.find(i => i.status === '进行中') || DB.internships[0] || null; },
  pending(){ return DB.records.filter(r => r.status === '待确认' || r.status === '整理中'); },
  confirmed(){ return DB.records.filter(r => r.status === '已完成'); },
  weekRecords(){
    const now = new Date(); const start = new Date(now); start.setDate(now.getDate() - ((now.getDay()+6)%7));
    return DB.records.filter(r => new Date(r.createdAt || r.date) >= new Date(iso(start)+'T00:00:00'));
  },
  materialsPending(){ return DB.materials.filter(m => m.status === '待确认'); },
  materialsDone(){ return DB.materials.filter(m => m.status === '已确认'); },
  abilityStats(){
    const map = {};
    DB.materials.filter(m => m.status === '已确认').forEach(m => (m.ability||[]).forEach(a => { map[a] = (map[a]||0)+1; }));
    return Object.entries(map).sort((a,b) => b[1]-a[1]);
  },
  profileScore(){
    const p = DB.profile;
    const keys = ['name','school','major','degree','grad','city','email','phone','target','bio'];
    const filled = keys.filter(k => String(p[k]||'').trim()).length + (p.skills && p.skills.length ? 1 : 0);
    return Math.round(filled / (keys.length + 1) * 100);
  },
  profileFilled(){ return !!String(DB.profile.name||'').trim(); }
};

function weekBars(){
  const now = new Date();
  const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay()+6)%7));
  const labels = ['一','二','三','四','五','六','日'];
  const bars = labels.map((l,i) => {
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const key = iso(d);
    const count = DB.records.filter(r => (r.date || '') === key).length;
    return { label: l, count, h: 6, date: key, today: key === iso() };
  });
  const max = Math.max(1, ...bars.map(b => b.count));
  bars.forEach(b => { b.h = 6 + Math.round(b.count / max * 50); });
  return { bars };
}

function updateStarBar(){
  const s = draft.struct || {};
  STAR_FIELDS.forEach(([k]) => {
    const seg = $('star_' + k);
    if(!seg) return;
    const on = !!String(s[k]||'').trim();
    const m = PART_META[k];
    seg.style.background = on ? m.fg : m.bg;
    seg.style.color = on ? '#fff' : m.fg;
    const row = $('row_' + k);
    if(row) row.style.borderColor = on ? m.fg : '#DDE6E2';
  });
  const txt = $('starProgressText');
  if(txt) txt.textContent = starCount() ? starCount() + '/4 已填写' : 'S 可跳过';
}
function focusStar(k){
  const el = $('s_' + k);
  if(el) el.focus({ preventScroll:false });

function updateCount(){
  const c = $('charCount');

function renderSplitPreview(){
  const box = $('splitPreview');
  if(!box) return;
  const text = (draft.text || '').trim();
  const list = text ? classifyClauses(text, draft.ov) : [];
  const filled = new Set(list.map(x => x.part));
  PART_ORDER.forEach(k => {
    const el = $('pc_' + k);
    if(!el) return;
    const on = filled.has(k);
    el.style.background = on ? PART_META[k].bg : '#F1F4F2';
    el.style.color = on ? PART_META[k].fg : '#8A9793';
  });
  if(!text){
    box.innerHTML = `
      <div class="flex items-center justify-between mb-1.5">
        <p class="text-[10.5px] text-t3 tracking-wide">STAR 分区预览</p>
        <span class="text-[10px] text-t3">边写边分</span>
      </div>
      <p class="text-[11px] text-t3 leading-relaxed">一句话一件事：背景（谁提的、为什么）· 目标（要达成什么）· 行动（你本人做了什么）· 结果（可验证的产出）。写完这里会逐句显示归属。</p>
      <button onclick="fillSample()" class="press mt-2.5 h-7 px-2.5 bg-mist text-brand text-[10.5px] rounded-md">填一段示例看看</button>`;
    return;
  }
  const n = PART_ORDER.filter(k => filled.has(k)).length;
  const rows = list.map((x, i) => {
    const m = PART_META[x.part];
    const tag = x.low ? '承接上文' : (x.cues.length && !x.locked ? x.cues.slice(0,2).join('·') : '');
    return `<button onclick="cyclePart(${i})" class="press w-full flex items-start gap-2 text-left py-[3px] rounded-[6px] active:bg-[#F3F7F5]">
      <span class="shrink-0 w-5 h-5 rounded-[6px] text-[9.5px] font-medium flex items-center justify-center mt-[1px]" style="background:${m.bg};color:${m.fg}">${m.L}</span>
      <span class="flex-1 min-w-0 text-[11.5px] leading-[1.7] ${x.low ? 'text-t3' : 'text-t2'}">${esc(x.text)}</span>
      <span class="shrink-0 text-[8.5px] text-t3 mt-[3px] max-w-[64px] truncate">${esc(tag)}</span>
    </button>`;
  }).join('');
  box.innerHTML = `
    <div class="flex items-center justify-between mb-1.5">
      <p class="text-[10.5px] text-t3 tracking-wide">STAR 分区预览</p>
      <span class="text-[10px] num ${n === 4 ? 'text-brand' : 'text-t3'}">${n}/4 已识别</span>
    </div>
    <div class="space-y-0.5">${rows}</div>
    ${list.length === 1 && text.length > 30 ? `<p class="text-[9.5px] text-[#8C6A46] mt-2 leading-relaxed">只识别到 1 句：建议用逗号或句号把「背景 / 目标 / 动作 / 结果」分开，分区会更准。</p>` : ''}
    ${PART_ORDER.filter(k => !filled.has(k)).length ? `<p class="text-[9.5px] text-t3 mt-2 leading-relaxed">未识别：${PART_ORDER.filter(k => !filled.has(k)).map(k => PART_META[k].L + ' ' + PART_META[k].name).join('、')}，可补充，也可保存后让 AI 追问。</p>` : `<p class="text-[9.5px] text-brand mt-2 leading-relaxed">四栏齐全，保存后可直接确认沉淀。</p>`}
    ${Object.keys(draft.ov).length ? `<button onclick="resetSplit()" class="press text-[10px] text-brand mt-2">恢复自动分区</button>` : ''}`;
}
function cyclePart(i){
  const list = classifyClauses((draft.text || '').trim(), draft.ov);
  const it = list[i];
  if(!it) return;
  const next = PART_ORDER[(PART_ORDER.indexOf(it.part) + 1) % PART_ORDER.length];
  draft.ov = { ...draft.ov, [it.key]: next };
  renderSplitPreview();
  toast('已改为 ' + PART_META[next].L + ' ' + PART_META[next].name);
}
function resetSplit(){ draft.ov = {}; renderSplitPreview(); }
function fillSample(){
  draft.text = '客户临时要一份证据清单，导师让我把近半年的聊天记录整理出来。我先按时间排序，再标注关键证据，最后交付了一份 12 页清单，客户当天确认了。';
  draft.ov = {};
  renderAdd();

}
function addTag(){
  const inp = $('tagInput'); const v = (inp.value||'').trim().replace(/^#/,'').replace(/["'<>`\\]/g,'').slice(0,12);
  if(!v) return;
  if(draft.tags.includes(v)){ toast('标签已存在'); return; }
  if(draft.tags.length >= 8){ toast('最多 8 个标签'); return; }
  draft.tags.push(v); inp.value=''; renderAdd(); $('tagInput') && $('tagInput').focus();
}
function removeTag(t){ draft.tags = draft.tags.filter(x => x !== t); renderAdd(); }
function addFiles(input){
  [...input.files].forEach(f => { if(draft.files.length < 6) draft.files.push({ name:f.name, size:f.size }); });
  input.value = '';
  renderAdd();
}

function submitRecord(){
  let text = '', summary = '', ov = null;
  if(draft.mode === 'quick'){
    text = (draft.text || '').trim();
    if(!text){ toast('请先输入记录内容'); return; }
    summary = text;
    ov = { ...draft.ov };
  } else {
    const s = draft.struct;
    if(!s.task.trim()){ toast('请填写 T 任务：要解决什么问题'); focusStar('task'); return; }
    if(!s.action.trim()){ toast('请填写 A 行动：你具体做了什么'); focusStar('action'); return; }
    const parts = [];
    if(s.situation.trim()) parts.push('情境：' + s.situation.trim());
    parts.push('任务：' + s.task.trim());
    parts.push('行动：' + s.action.trim());
    if(s.result.trim()) parts.push('结果：' + s.result.trim());
    text = parts.join('；');
    summary = s.task.trim();
  }
  const r = {
    id: uid(), date: iso(), createdAt: new Date().toISOString(), time: nowHM(),
    type: draft.type, text, summary,
    struct: draft.mode === 'struct' ? { ...draft.struct } : null,
    tags: [...draft.tags], files: [...draft.files],
    internshipId: draft.internshipId || '', status: '整理中', ai: null
  };
  DB.records.unshift(r);
  draft = { mode:'quick', type:'工作', text:'', struct:{situation:'',task:'',action:'',result:''}, tags:[], files:[], internshipId:draft.internshipId, ov:{} };
  saveDB();
  switchTab('timeline');
  toast('已保存原始记录，AI 开始整理…');
  setTimeout(() => {
    if(!DB.records.find(x => x.id === r.id)) return;
    r.ai = makeDraft(r.text, r.struct, { ov });
    r.status = '待确认';
    refresh();
    toast('AI 整理完成，请确认后沉淀');
  }, 1600);
}

/* =========================================================
   STAR 分区引擎
   做法：先按标点分成小句，再按「线索词 + 结构特征」给每个小句
   在 S/T/A/R 四栏上打分，取最高分归位；分不出的承接上文。
   全部规则透明、可被用户逐句改判，不凭顺序硬切、不编造成果。
   ========================================================= */
const PART_META = {
  situation:{ L:'S', name:'情境', hint:'背景与限制', fg:'#4E86A8', bg:'#ECF4F9' },
  task:     { L:'T', name:'任务', hint:'分给你的目标', fg:'#2E6F66', bg:'#E9F2EF' },
  action:   { L:'A', name:'行动', hint:'你本人做的', fg:'#3E8E86', bg:'#E3F1EE' },
  result:   { L:'R', name:'结果', hint:'可验证的产出', fg:'#96703F', bg:'#FAF1E6' }
};
const PART_ORDER = ['situation','task','action','result'];
const NUM_RE = /(\d+(?:[.,]\d+)?)\s*(个|条|份|页|次|篇|家|人|件|处|项|版|套|张|小时|天|周|月|年|%|％|倍)/;
const STAR_CUES = {

    ['让我',3],['叫我',3],['要把',3],['截止',3],['之前交',3],['输出',2],['约定',2]
  ],
  action:[
    ['我',2.5],['自己',2],['独立',2],['先',2],['然后',2],['接着',2],['最后',1],['再',1],
    ['通过',2],['按',1.5],['逐一',2],['逐个',2],['逐条',2],['整理',3],['梳理',3],['分类',3],
    ['核对',3],['检索',3],['查询',3],['撰写',3],['起草',3],['制作',2],['搭建',2],['沟通',2],
    ['对接',3],['协调',3],['跟进',2],['录入',3],['校对',3],['汇总',3],['拆解',2],['标注',3],
    ['复盘',2],['请教',2],['统计',3],['比对',3],['归因',2],['转成',2],['参加',2.5],['参与',2.5],
    ['回问',2.5],['询问',2],['发现',2],['做成',2.5],['整理成',2],['重写',2]
  ],
  result:[
    ['最终',3],['结果',3.5],['产出',4],['完成',2],['提交',3],['交付',3.5],['通过',2],['采纳',4],
    ['上线',3],['节省',4],['提升',4],['减少',3],['避免',3],['覆盖',3],['共',2.5],['被',1.5],['得到',2],
    ['获得',3],['落地',3],['准确率',4],['效率',3],['确认',3.5],['认可',4],['满意',3.5],['零差错',4],['通过率',4]
  ]

/* 切句：先按句末标点，再按逗号切到「一件事」的粒度 */
function splitClauses(text){
  const out = [];
  String(text || '').split(/[。；;！!？?\n]+/).forEach(seg => {
    String(seg).split(/[，,]+/).forEach(p => {
      const x = p.trim().replace(/^[、\s]+|[、\s]+$/g, '');
      if(x) out.push(x);
    });
  });
  return out.slice(0, 24);
}
/* 单个小句在四栏上的得分 */
function scoreClause(c){
  const sc = { situation:0, task:0, action:0, result:0 };
  const cues = { situation:[], task:[], action:[], result:[] };
  PART_ORDER.forEach(k => STAR_CUES[k].forEach(([w, wt]) => {
    if(c.indexOf(w) >= 0){ sc[k] += wt; cues[k].push(w); }
  }));
  if(/^(今天|昨天|前天|上周|这周|本周|最近|上午|下午|晚上|当时|一开始|刚入职)/.test(c)) sc.situation += 2;
  if(/(让|叫|要求|安排|指派|交给|委托|吩咐)\s*(我|我们)?/.test(c)) sc.task += 2.5;
  if(/^(导师|领导|老板|老师|主管|同事|客户|甲方|对方)/.test(c) && !/^我/.test(c)){ sc.action -= 3.5; sc.situation += 1; }
  if(/^我/.test(c)) sc.action += 2;
  if(/了/.test(c)) sc.action += 1.5;
  if(/(把|将).{1,14}(整理|做成|拆|分|改|汇总|归档|录入|转成)/.test(c)) sc.action += 2;
  if(NUM_RE.test(c)){ sc.result += 3.2; cues.result.push('含数量'); }
  if(/(共|一共|总计|累计)\s*[\d一二三四五六七八九十]/.test(c)) sc.result += 1.5;
  if(/(最终|最后)[^，,]{0,6}(交付|提交|完成|产出|形成|实现)/.test(c)) sc.result += 3;
  if(!sc.action && !sc.result && sc.situation) sc.situation += 1;
  return { sc, cues };
}
/* 分区主函数；ov 为人工改判表 { '序号|原句': 'part' } */
function classifyClauses(text, ov){
  const out = [];
  let prev = '';
  splitClauses(text).forEach((c, i) => {
    const { sc, cues } = scoreClause(c);
    let part = '', best = 0;
    PART_ORDER.forEach(k => { if(sc[k] > best){ best = sc[k]; part = k; } });
    let low = false;
    if(!part || best < 1.8){ part = prev || 'action'; low = true; }
    const key = i + '|' + c;
    let locked = false;
    if(ov && ov[key]){ part = ov[key]; low = false; locked = true; }
    out.push({ text:c, part, score:Math.round(best * 10) / 10, cues:(cues[part] || []).slice(0,3), low, locked, key });
    prev = part;
  });
  return out;
}
function structFromClauses(list){
  const g = k => (list || []).filter(x => x.part === k).map(x => x.text).join('，').replace(/^[，,、]+|[，,、]+$/g, '');
  return { situation:g('situation'), task:g('task'), action:g('action'), result:g('result') };
}
/* 没写目标时，用第一条行动推断一个 T（明确标注为推断，可改） */
function deriveTask(action){
  const first = String(action || '').split(/[，,；;。]/)[0] || '';
  let t = first
    .replace(/^(今天|昨天|前天|上周|这周|本周|最近|上午|下午|晚上|我|自己|先|然后|接着|最后|再)+/g, '')
    .replace(/^[，,、：:\s]+/, '')
    .replace(/了/g, '')
    .replace(/(一下|一遍|一轮)$/, '')
    .trim();
  if(t.length > 26) t = t.slice(0, 26);
  return t;
}
function ovOf(r){
  const s = r && r.ai && r.ai.split;
  if(!s || s.text !== r.text) return null;
  const ov = {};
  s.list.forEach((x, i) => { ov[i + '|' + x.text] = x.part; });
  return ov;
}
function makeDraft(text, struct, opts){
  const t = (text || '').trim();
  const s = struct || {};
  const ov = (opts && opts.ov) || null;
  const manual = {
    situation:(s.situation || '').trim(), task:(s.task || '').trim(),
    action:(s.action || '').trim(), result:(s.result || '').trim()
  };
  const hasManual = !!(manual.task || manual.action);
  const list = hasManual ? [] : classifyClauses(t, ov);
  const auto = structFromClauses(list);
  const m = {
    situation: manual.situation || auto.situation,
    task: manual.task || auto.task,
    action: manual.action || auto.action,
    result: manual.result || auto.result
  };
  /* 缺 T：用行动推断，并在界面上标明「推断」 */
  let derivedTask = false;
  if(!m.task && m.action){ m.task = deriveTask(m.action); derivedTask = !!m.task; }
  if(!m.task){ m.task = (splitClauses(t)[0] || t).slice(0, 30) || '未命名记录'; derivedTask = true; }
  /* R 只放原文里说过的结果；原文的数字若没被归进 R，只作为候选 */
  let suggest = null;
  if(!m.result){
    const hit = t.match(NUM_RE);
    if(hit) suggest = { key:'result', text:hit[0].replace(/\s+/g, ' '), at:Date.now() };
  }
  const ability = guessAbility(t);
  let question = '', qkey = '';
  if(!m.action){ question = '你具体做了什么？用什么方法、和谁配合？'; qkey = 'action'; }
  else if(!m.result){ question = '这次可验证的产出是什么？写数量、页数、通过率等；确实没有就写「无具体产出」。'; qkey = 'result'; }
  else if(!m.situation){ question = '这件事的背景是什么？谁提的需求、为什么要做？'; qkey = 'situation'; }
  else if(!ability.length){ question = '这段经历里，你觉得最能体现的能力是什么？'; qkey = 'ability'; }
  else if(m.action.length < 12){ question = '行动再具体一点：你用了什么方法、和谁配合完成的？'; qkey = 'action'; }
  return {
    ...m, ability, question, qkey, suggest, answer:'',
    split: list.length ? { text:t, list } : null,
    auto: !hasManual, derivedTask, at: Date.now()
  };
}
function guessAbility(text){
  const map = [['整理','信息整理'],['归档','信息整理'],['检索','信息检索'],['查询','信息检索'],['报告','书面表达'],['周报','书面表达'],['撰写','书面表达'],
    ['会议','沟通协作'],['对接','沟通协作'],['沟通','沟通协作'],['协调','沟通协作'],['表格','数据处理'],['数据','数据处理'],['分析','逻辑分析'],['法规','法律检索'],
    ['合同','文本审阅'],['审阅','文本审阅'],['校对','文本审阅'],['项目','项目管理'],['细致','细致耐心'],['核对','细致耐心'],['复盘','逻辑分析']];
  return [...new Set(map.filter(([k]) => text.includes(k)).map(([,v]) => v))].slice(0,3);
}
function processAI(id){
  const r = DB.records.find(x => x.id === id);
  if(!r) return;
  r.status = '整理中'; saveDB();
  toast('AI 正在整理…');
  setTimeout(() => {
    if(!DB.records.find(x => x.id === id)) return;
    r.ai = makeDraft(r.text, r.struct, { ov: ovOf(r) });
    r.status = '待确认';
    refresh();
    toast('整理完成，等待你确认');
  }, 1200);
}
</script>

  const it = list[i];
  if(!it) return;
  const next = PART_ORDER[(PART_ORDER.indexOf(it.part) + 1) % PART_ORDER.length];
  SPLIT.ov = { ...SPLIT.ov, [it.key]: next };
  renderSplitSheet();
}
function autoSplit(){
  if(!SPLIT) return;
  SPLIT.ov = {};
  renderSplitSheet();
  toast('已恢复自动分区');
}
function applySplit(){
  if(!SPLIT) return;
  const r = DB.records.find(x => x.id === SPLIT.id);
  if(!r) return;
  const old = r.ai || {};
  const next = makeDraft(r.text, null, { ov: SPLIT.ov });
  if(old.ability && old.ability.length) next.ability = old.ability;
  next.answer = old.answer || '';
  r.ai = next;
  SPLIT = null;
  saveDB(); closeSheet(); refresh();
  toast('分区已更新，四栏内容已重写');
}
function saveRecordForm(id, confirmIt){
  const r = DB.records.find(x => x.id === id);
  if(!r) return;
  const text = ($('recEditText')?.value || '').trim();
  if(!text){ toast('原始记录不能为空'); return; }
  r.text = text;
  if(r.ai){
    r.ai.situation = ($('aiSituation')?.value || '').trim();
    r.ai.task = ($('aiTask')?.value || '').trim() || r.ai.task;
    r.ai.action = ($('aiAction')?.value || '').trim() || r.ai.action;
    r.ai.result = ($('aiResult')?.value || '').trim();
    r.ai.ability = ($('aiAbility')?.value || '').split(/[，,、\s]+/).map(x => x.trim()).filter(Boolean).slice(0,6);
    const ans = ($('aiAnswer')?.value || '').trim();
    if(ans){
      r.ai.answer = ans;
      if(!r.ai.result && !/记不清|不确定|忘了|不知道/.test(ans)) r.ai.result = ans;
      r.ai.question = '';
    }
    if(!r.ai.task) r.ai.task = text.slice(0, 30);
  }
  if(confirmIt){
    if(!r.ai){ toast('AI 还没整理完，请稍候'); return; }
    if(!String(r.ai.task||'').trim() || !String(r.ai.action||'').trim()){
      toast('请先补全 T 任务和 A 行动');
      return;
    }
    if(!r.__vaguePass && /大概|可能|应该|差不多|左右|估计|似乎|或许|不确定/.test(String(r.ai.result||''))){
      saveDB();
      const finish = saveRecordForm;
      ask('结果 R 表述不确定', '「大概」「可能」这类词让结果无法核对，建议改成具体数字或「无具体产出」。仍要沉淀吗？', '仍然沉淀', () => {
        r.__vaguePass = true; finish(id, true);
      });
      return;
    }
    delete r.__vaguePass;
    r.status = '已完成';
    r.confirmedAt = new Date().toISOString();
    const mkM = $('mkMaterial') ? $('mkMaterial').checked : false;
    const mkK = $('mkKnowledge') ? $('mkKnowledge').checked : false;
    if(mkM && !DB.materials.some(m => m.recordId === r.id)){
      DB.materials.unshift({
        id: uid(), recordId: r.id, title: shortTitle(r.ai.task),
        situation: r.ai.situation || '', task: r.ai.task, action: r.ai.action,
        result: r.ai.result, data: '', ability: r.ai.ability || [],
        status: '待确认', createdAt: new Date().toISOString()
      });
    }
    if(mkK && !DB.knowledge.some(k => k.recordId === r.id)){
      DB.knowledge.unshift({
        id: uid(), recordId: r.id, cat: '工作流程', title: (r.ai.task || '未命名条目').slice(0, 26),
        body: [r.ai.situation, r.ai.result, r.ai.action, r.ai.answer].filter(Boolean).join('\n') || r.text,
        tags: r.tags || [], source: r.date, createdAt: new Date().toISOString()
      });
    }
  }
  saveDB(); closeSheet(); refresh();
  toast(confirmIt ? (r.ai && r.ai.ability.length ? '已确认沉淀，素材已生成' : '已确认沉淀') : '修改已保存');
}
function deleteRecord(id){
  ask('删除这条记录？', '删除后进入回收站，可在「我的 → 回收站」恢复。', '删除', () => {

function saveNote(id){
  const r = DB.records.find(x => x.id === id);
  const v = ($('appendText')?.value || '').trim();
  if(!v){ toast('请输入补充内容'); return; }
  r.text = r.text + '\n补充：' + v;
  /* 已存为 STAR 的记录：把补充内容按语义合并进对应栏，不丢信息 */
  if(r.struct){
    const add = structFromClauses(classifyClauses(v));
    PART_ORDER.forEach(k => {
      if(add[k]) r.struct[k] = r.struct[k] ? r.struct[k] + '，' + add[k] : add[k];
    });
  }
  r.ai = makeDraft(r.text, r.struct, { ov: ovOf(r) });
  r.status = '待确认';
  saveDB(); closeSheet(); refresh(); toast('已补充，AI 重新整理了结果');
}
function processAll(){
  const list = DB.records.filter(r => r.status === '整理中');
  if(!list.length){ toast('没有等待整理的记录'); return; }
  list.forEach((r,i) => setTimeout(() => {
    if(!DB.records.find(x => x.id === r.id)) return;
    r.ai = makeDraft(r.text, r.struct, { ov: ovOf(r) }); r.status = '待确认'; refresh();
  }, 400 * i));
  toast(`正在整理 ${list.length} 条记录`);
}

let archEditId = null;
function saveInternship(){
  const company = ($('itCompany').value||'').trim();
  if(!company){ toast('请填写公司名称'); $('itCompany').focus(); return; }
  const start = $('itStart').value, end = $('itEnd').value;
  if(!start){ toast('请选择开始日期'); return; }
  if(end && end < start){ toast('结束日期不能早于开始日期'); return; }
  const status = $('itStatus').value;
  const data = {
    company, dept: ($('itDept').value||'').trim(), role: ($('itRole').value||'').trim(),
    start, end, weekly: $('itWeekly').value, status,
    mentor: ($('itMentor').value||'').trim(), note: ($('itNote').value||'').trim()
  };
  const editId = archEditId;
  if(editId){
    const it = DB.internships.find(x => x.id === editId);
    if(it) Object.assign(it, data);
  } else {
    DB.internships.unshift({ id: uid(), ...data, createdAt: new Date().toISOString() });
  }
  if(status === '进行中'){
    DB.internships.forEach(i => { if(i.company !== company && i.status === '进行中') i.status = '已结束'; });
  }
  saveDB(); backSub(); refresh(); toast(editId ? '档案已更新' : '实习档案已创建');
}

    DB.internships = DB.internships.filter(i => i.id !== id);
    saveDB(); closeSub(); refresh(); toast('已删除实习档案');
  }, true);
}

<script>
/* =========================================================

   ========================================================= */
function copyText(t){
  const done = () => toast('已复制到剪贴板');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e) { toast('复制失败，请长按选择文本'); }
    ta.remove();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(fallback);
  } else fallback();
}

/* =========================================================
   简历素材库

let resumeFilter = '全部', resumeStatus = '全部', resumeSort = 'new', mAbility = [], mEditId = null;

    if(resumeFilter !== '全部') list = list.filter(m => (m.ability || []).includes(resumeFilter));
    if(resumeSort === 'ability') list.sort((a,b) => (b.ability||[]).length - (a.ability||[]).length || (b.createdAt||'').localeCompare(a.createdAt||''));

/* 简历文案：把四栏连成一段话，去掉 STAR 字样与互相重复的部分 */
function _normTxt(s){ return String(s||'').replace(/[，,。；;、：:！!？?\s（）()]/g,''); }
function overlap(a, b){
  const x = _normTxt(a), y = _normTxt(b);
  if(!x || !y) return 0;
  let best = 0;
  const row = new Array(y.length + 1).fill(0);
  for(let i = 1; i <= x.length; i++){
    let diag = 0;
    for(let j = 1; j <= y.length; j++){
      const up = row[j];
      row[j] = x[i-1] === y[j-1] ? diag + 1 : 0;
      if(row[j] > best) best = row[j];
      diag = up;
    }
  }
  return best / Math.min(x.length, y.length);
}
function _cleanPart(s){
  return String(s||'').trim()
    .replace(/^[（(]?\s*(情境|任务|行动|结果|S|T|A|R)\s*[:：]\s*/i, '')
    .replace(/[。；;]+$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function resumeLine(m){
  let s = _cleanPart(m.situation).replace(/^(因为|由于)/, '');
  let t = _cleanPart(m.task);
  let a = _cleanPart(m.action);
  let r = _cleanPart(m.result);
  const d = _cleanPart(m.data);
  if(t && a && overlap(t, a) > 0.55) t = '';
  if(t && s && overlap(s, t) > 0.6) t = '';
  if(s && a && overlap(s, a) > 0.8) s = '';
  if(r && a && overlap(r, a) > 0.85) r = '';
  const seq = [s, t, a, r].filter(Boolean).map(x => x.replace(/^[，,]+|[，,]+$/g, ''));
  let line = seq.join('，').replace(/，{2,}/g, '，').replace(/^[，,。；;]+|[，,。；;]+$/g, '');
  if(!line) line = _cleanPart(m.title);
  line += '。';
  if(d && !line.includes(d) && overlap(d, line) < 0.6) line = line.replace(/。$/, '') + '，' + d.replace(/[。；;]+$/, '') + '。';
  return line;
}

function rangeStart(range){
  const now = new Date();
  if(range === 'today') return iso();
  if(range === 'week'){ const d = new Date(now); d.setDate(now.getDate() - ((now.getDay()+6)%7)); return iso(d); }
  if(range === 'month') return iso(new Date(now.getFullYear(), now.getMonth(), 1));
  return '0000-01-01';
}
function buildReport(type, range, scope, focus){
  const start = rangeStart(range);
  const all = DB.records.filter(r => (r.date||'') >= start);
  let recs = scope === 'confirmed' ? all.filter(r => r.status === '已完成') : all.slice();
  /* 还没有确认记录时不空转：退回全部记录，并在报告里说明 */
  let fallback = false;
  if(!recs.length && all.length){ recs = all.slice(); fallback = true; }
  if(!recs.length) return null;
  recs.sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.time||'').localeCompare(b.time||''));
  const label = type === 'day' ? '日志' : type === 'week' ? '周报' : '月报';
  const dates = [...new Set(recs.map(r => r.date))];
  const period = dates.length === 1 ? fmtDateFull(dates[0])
    : `${fmtDateFull(dates[0])} — ${fmtDateFull(dates[dates.length-1])}`;
  const abilities = [...new Set(recs.flatMap(r => (r.ai && r.ai.ability) || []))];
  const lines = [];
  lines.push(`【${label}】${period}`);
  lines.push('');
  lines.push(type === 'week' ? '一、本周工作' : type === 'month' ? '一、本月工作' : '一、今日记录');
  let cur = '';
  recs.forEach(r => {
    if(r.date !== cur){ cur = r.date; lines.push(''); lines.push(`${fmtDate(cur)} ${weekdayName(cur)}`); }
    const task = (r.ai && r.ai.task) || r.summary || r.text.slice(0,30);
    const res = (r.ai && r.ai.result) ? ` ｜ 产出：${r.ai.result}` : '';
    lines.push(`· ${task}${res}`);
  });
  lines.push('');
  lines.push('二、产出与能力');
  lines.push(`· 共 ${recs.length} 条${scope === 'confirmed' && !fallback ? '已确认' : fallback ? '（含待确认）' : ''}记录，覆盖 ${dates.length} 个工作日`);
  if(abilities.length) lines.push(`· 涉及能力：${abilities.join('、')}`);
  const withResult = recs.filter(r => r.ai && r.ai.result).length;
  lines.push(`· 有明确产出描述的记录：${withResult} 条`);
  if(focus) { lines.push(''); lines.push('三、补充说明'); lines.push(`· ${focus}`); }
  lines.push('');
  lines.push(type === 'week' ? '四、下周计划' : type === 'month' ? '四、下月计划' : '三、明日计划');
  lines.push('· （待补充，可自行编辑）');
  return { period, content: lines.join('\n'), fallback };
}

function bigrams(s){
  const t = String(s).replace(/[^\u4e00-\u9fa5a-zA-Z]/g,'');
  const set = new Set();
  for(let i = 0; i < t.length - 1; i++) set.add(t.slice(i,i+2));
  return [...set];
}
function interviewMatch(iv){
  const jdSet = new Set(bigrams(iv.jd + ' ' + iv.role));
  const scored = DB.records.map(r => {
    const txt = [r.text, r.ai && r.ai.task, r.ai && r.ai.result, (r.tags||[]).join(' ')].filter(Boolean).join(' ');
    const recSet = new Set(bigrams(txt));
    let hit = 0; jdSet.forEach(g => { if(recSet.has(g)) hit++; });
    return { r, hit };
  }).filter(x => x.hit > 0).sort((a,b) => b.hit - a.hit);
  const denom = Math.max(15, Math.min(80, Math.round(jdSet.size * 0.18)));
  const score = scored.length ? Math.min(96, Math.round(Math.min(1, scored[0].hit / denom) * 100)) : 0;
  return { score, top: scored.slice(0,3).map(x => x.r) };
}

function download(name, content, mime){
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function buildMarkdown(){
  const p = DB.profile;
  const L = [];
  L.push(`# ${p.name || '我'}的实习成长档案`);
  L.push('');
  L.push('## 一、个人信息');
  const rows = [['姓名',p.name],['学校',p.school],['专业',p.major],['学历',p.degree],['毕业年份',p.grad],['城市',p.city],['邮箱',p.email],['电话',p.phone],['求职方向',p.target]];
  rows.filter(r => r[1]).forEach(([k,v]) => L.push(`- ${k}：${v}`));
  if((p.skills||[]).length) L.push(`- 技能：${p.skills.join('、')}`);
  if(p.bio) L.push(`- 简介：${p.bio}`);
  L.push('');
  L.push('## 二、实习档案');
  if(!DB.internships.length) L.push('（暂无）');
  DB.internships.forEach(i => {
    L.push(`### ${i.company}${i.dept?' · '+i.dept:''}`);
    L.push(`- 岗位：${i.role || '未填写'}`);
    L.push(`- 时间：${i.start || '—'} 至 ${i.end || '—'}（${i.status}）`);
    if(i.weekly) L.push(`- 每周出勤：${i.weekly}`);
    if(i.mentor) L.push(`- 指导人：${i.mentor}`);
    if(i.note) L.push(`- 备注：${i.note}`);
    L.push('');
  });
  L.push('## 三、工作记录');
  if(!DB.records.length) L.push('（暂无）');
  DB.records.forEach(r => {
    L.push(`### ${fmtDateFull(r.date)} ${weekdayName(r.date)} ${r.time || ''} · ${r.type}（${r.status}）`);
    L.push(r.text);
    if(r.ai && r.ai.result) L.push(`- 整理成果：${r.ai.result}`);
    L.push('');
  });
  L.push('## 四、简历素材');
  if(!DB.materials.length) L.push('（暂无）');
  DB.materials.forEach(m => {
    L.push(`### ${m.title}（${m.status}）`);
    if(m.situation) L.push(`- 情境：${m.situation}`);
    if(m.task) L.push(`- 任务：${m.task}`);
    if(m.action) L.push(`- 行动：${m.action}`);
    if(m.result) L.push(`- 结果：${m.result}`);
    if(m.data) L.push(`- 数据依据：${m.data}`);
    if((m.ability||[]).length) L.push(`- 能力：${m.ability.join('、')}`);
    L.push('');
  });
  L.push('## 五、报告');
  if(!DB.reports.length) L.push('（暂无）');
  DB.reports.forEach(r => { L.push(`### ${r.period}`); L.push('```'); L.push(r.content); L.push('```'); L.push(''); });
  L.push('## 六、知识库');
  if(!DB.knowledge.length) L.push('（暂无）');
  DB.knowledge.forEach(k => { L.push(`### [${k.cat}] ${k.title}`); L.push(k.body); L.push(''); });
  return L.join('\n');
}
function exportMarkdown(){

function exportWord(){
  const md = buildMarkdown()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/^### (.*)$/gm,'<h3>$1</h3>')
    .replace(/^## (.*)$/gm,'<h2>$1</h2>')
    .replace(/^# (.*)$/gm,'<h1>$1</h1>')
    .replace(/^- (.*)$/gm,'<p>· $1</p>')
    .replace(/\n/g,'<br>');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>实习成长档案</title>
  <style>body{font-family:"Microsoft YaHei",sans-serif;line-height:1.8;font-size:14px;color:#1E302E}h1{font-size:22px}h2{font-size:17px;margin-top:20px}h3{font-size:15px}</style></head><body>${md}</body></html>`;
  download(`实习成长档案-${iso()}.doc`, html, 'application/msword');
  toast('Word 文档已开始下载');
}

function restoreTrash(tid){
  const i = DB.trash.findIndex(x => x.id === tid);
  if(i < 0) return;
  const t = DB.trash[i];
  const key = TRASH_MAP[t.kind];
  if(key && Array.isArray(DB[key])){
    if(!DB[key].some(x => x.id === t.data.id)) DB[key].unshift(t.data);
  }
  DB.trash.splice(i,1);
  saveDB(); refresh(); toast('已恢复');
}
function purgeTrash(tid){
  ask('彻底删除？', '删除后无法恢复。', '彻底删除', () => {

function sendChat(text){

function aiReply(q){
  const t = q.toLowerCase();

    const built = buildReport('week','week','all','');
    if(!built) return { text:'本周还没有记录，先记两笔再来生成周报吧。', actions:[{label:'去记一笔', act:'add'}] };
    return { text:`根据本周 ${Q.weekRecords().length} 条记录，我拼了一份草稿：\n\n${built.content.slice(0, 260)}…\n\n在「日志 · 周报」里可以继续生成并编辑。`, actions:[{label:'打开报告', act:'reports'}] };
  }
  if(/简历|素材/.test(t)){
    const done = Q.materialsDone();
    if(!done.length) return { text: Q.confirmed().length ? `你有 ${Q.confirmed().length} 条已确认记录，但还没有确认过的简历素材。可以在记录详情里勾选生成，然后到素材库确认。` : '还没有可用的简历素材。先记几条工作记录，确认沉淀后我再帮你提炼。', actions:[{label:'打开素材库', act:'resume'},{label:'看记录', act:'timeline'}] };

  }

    if(!pend) return { text:'现在没有待整理的记录，很干净。', actions:[{label:'去记一笔', act:'add'}] };
    return { text:`你有 ${pend} 条记录等待处理，其中 ${DB.records.filter(r=>r.status==='待确认').length} 条已整理待确认，${DB.records.filter(r=>r.status==='整理中').length} 条正在整理。`, actions:[{label:'去处理', act:'pending'}] };
  }

    if(!s.length) return { text:'资料和记录都比较完整了。下一步可以多写周报，或针对目标岗位补充面试提纲。', actions:[{label:'看成长', act:'growth'}] };
    return { text:'按优先级，建议你补充：\n' + s.map((x,i) => `${i+1}. ${x}`).join('\n'), actions:[{label:'完善资料', act:'profile'}] };
  }
  if(/总结|成长|能力/.test(t)){
    const abs = Q.abilityStats();
    if(!DB.records.length) return { text:'还没有记录，暂时无法总结。先写下第一条工作记录吧。', actions:[{label:'去记录', act:'add'}] };
    return { text:`当前累计 ${DB.records.length} 条记录、${Q.confirmed().length} 条已沉淀，覆盖 ${abs.length} 项能力${abs.length?'：'+abs.slice(0,4).map(([a,c])=>`${a}(${c})`).join('、'):''}。\n本月记录 ${DB.records.filter(r=>(r.date||'').slice(0,7)===iso().slice(0,7)).length} 条。`, actions:[{label:'看成长页', act:'growth'},{label:'生成本月总结', act:'summary'}] };
  }
  return { text:'我可以帮你：整理待确认记录、用真实记录生成周报、提炼简历素材、检查资料缺口。\n\n直接说需求，比如「帮我生成这周的周报」。', actions:[{label:'待整理', act:'pending'},{label:'周报', act:'reports'}] };
}
function suggestions(){
  const out = [];
  if(!Q.profileFilled()) out.push('完善个人信息：至少填写姓名');
  else if(Q.profileScore() < 60) out.push('补齐学校、专业、求职方向，首页展示会更完整');
  if(!DB.internships.length) out.push('创建一份实习档案，便于按公司归档记录');
  if(!DB.records.length) out.push('记录第一条工作内容（哪怕只有一句话）');
  if(Q.pending().length) out.push(`确认 ${Q.pending().length} 条待整理记录，AI 不会自动入库`);
  if(Q.confirmed().length && !Q.materialsDone().length) out.push('把已确认记录确认成简历素材');
  if(!DB.reports.length) out.push('生成第一份周报，检验记录是否够用');
  if(!DB.knowledge.length) out.push('把可复用的方法存入知识库');
  return out;
}
function aiAction(act){
  closeAI();
  if(act === 'pending') openSub('pending');
  else if(act === 'reports') openSub('reports');
  else if(act === 'resume') openSub('resume');
  else if(act === 'profile') openSub('profile');
  else if(act === 'add') switchTab('add');
  else if(act === 'timeline') switchTab('timeline');
  else if(act === 'growth') switchTab('growth');
  else if(act === 'summary') createSummaryReport();
}
function clearChat(){
  if(!DB.chat.length){ toast('对话已经是空的'); return; }
  ask('清空对话？','只清除聊天记录，不影响你的记录与资料。','清空',()=>{ DB.chat=[]; saveDB(); renderChat(); toast('对话已清空'); });
}

/* =========================================================
   导航角标 / 快捷键 / 初始化
   ========================================================= */
function renderNavBadge(){
  const n = Q.pending().length;
  const dot = $('navDot');
  if(!dot) return;
  dot.textContent = n > 9 ? '9+' : String(n);
  dot.classList.toggle('hidden', n === 0);
}
function init(){
  DB.records.forEach(r => {
    if(r.status === '整理中'){
      r.ai = r.ai || makeDraft(r.text, r.struct);
      r.status = '待确认';
    }
  });
  saveDB();
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.addEventListener('click', () => switchTab(b.dataset.tab));
  });
  $('chatInput').addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
  });
  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    if(!$('confirmHost').classList.contains('hidden')){ closeConfirm(); return; }
    if(!$('sheetHost').classList.contains('hidden')){ closeSheet(); return; }
    if(!$('aiHost').classList.contains('hidden')){ closeAI(); return; }
    if(!$('subpage').classList.contains('hidden')){ backSub(); }
  });
  window.addEventListener('beforeunload', saveDB);
  switchTab('home');
  renderNavBadge();
}
init();
</script>

<script>
/* =========================================================
   补充交互：按天查看 / 附件信息 / 素材删除 / 提醒重置 / 报告下载
   ========================================================= */
function openDay(date){
  const rs = DB.records.filter(r => r.date === date).sort((a,b) => (a.time||'').localeCompare(b.time||''));
  openSheet(`${fmtDate(date)} ${weekdayName(date)}`, `<div class="p-4 space-y-2">
    ${rs.length ? rs.map(recordCard).join('') : '<div class="py-10 text-center"><p class="text-[12px] text-t2">这天还没有记录</p><p class="text-[10px] text-t3 mt-1">补记也可以，AI 会按保存时间归档</p></div>'}
  </div>`, `<div class="p-3"><button onclick="closeSheet();switchTab('add')" class="press w-full h-10 bg-brand text-white text-[13px] font-medium rounded-lg">记一笔</button></div>`);
}
function openFileInfo(rid, idx){
  const r = DB.records.find(x => x.id === rid);
  const f = r && r.files ? r.files[idx] : null;
  if(!f) return;
  const kb = (f.size/1024).toFixed(1);
  const ext = (f.name.split('.').pop() || '文件').toUpperCase();
  openSheet('附件信息', `<div class="p-4">
    <div class="bg-card border border-line rounded-xl p-4 flex items-center gap-3">
      <span class="w-10 h-10 rounded-lg bg-mist text-brand flex items-center justify-center text-[10px] font-semibold">${esc(ext.slice(0,4))}</span>
      <div class="min-w-0">
        <p class="text-[13px] text-t1 break-all">${esc(f.name)}</p>
        <p class="text-[10px] text-t3 mt-1">${kb} KB · 原型仅记录文件信息，未上传内容</p>
      </div>
    </div>
    <p class="text-[10px] text-t3 mt-3 leading-relaxed">在正式小程序中，附件会加密上传并在记录详情内预览；当前版本不读取文件内容。</p>
  </div>`, `<div class="p-3"><button onclick="closeSheet()" class="press w-full h-10 bg-white border border-line text-[13px] text-t2 rounded-lg">关闭</button></div>`);
}
function deleteMaterialFromForm(){
  const id = mEditId;
  if(!id) return;
  ask('删除这条素材？', '删除后可在回收站恢复。', '删除', () => {
    const i = DB.materials.findIndex(x => x.id === id);
    if(i < 0) return;
    const [m] = DB.materials.splice(i,1);
    DB.trash.unshift({ id:'t'+uid(), kind:'material', title:m.title, data:m, at:Date.now() });
    mEditId = null;
    saveDB(); backSub(); refresh(); toast('已移入回收站');
  }, true);
}
function resetRemind(){
  DB.settings.remind = true; DB.settings.weekly = true;
  saveDB(); renderSub(); renderTab(currentTab); toast('已恢复默认提醒设置');
}
function downloadReport(id){
  const r = DB.reports.find(x => x.id === id);
  if(!r) return;
  const html = `<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(r.period)}</title>
  <style>body{font-family:"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.9;color:#1E302E}pre{white-space:pre-wrap;font-family:inherit}</style></head>
  <body><pre>${esc(r.content)}</pre></body></html>`;
  download(`报告-${r.period.replace(/[\\/:*?"<>|]/g,'-')}.doc`, html, 'application/msword');
  toast('报告已开始下载');
}
function useTemplate(k){
  const tpl = {
    '会议':'参加……会议，会上要同步项目进度。我负责会议记录，会后整理出……条待办，已同步给相关同事。',
    '对接':'对接……，对方临时提出……需求。我逐条核对了……，当天返回了一份……页的说明。',
    '学习':'学习……，需要在一周内能用上。我跟着……练了一遍，现在可以独立完成……。',
    '事务':'日常事务，要处理……。我按……流程逐项处理，共完成……件，耗时约……小时。'
  }[k];
  if(!tpl) return;
  draft.text = draft.text.trim() ? draft.text.trim() + '\n' + tpl : tpl;
  renderAdd();
  const ta = $('recText');
  if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  toast('已套用模板，把「……」替换成你的真实内容');
}
function recentSediments(){
  const items = [
    ...DB.materials.slice(0,2).map(m => ({ kind:'素材', title:m.title, sub:m.status, act:`openSub('resume')` })),
    ...DB.knowledge.slice(0,2).map(k => ({ kind:'知识', title:k.title, sub:k.cat, act:`openSub('knowledge')` }))
  ].slice(0,3);
  if(!items.length) return `<p class="text-[11px] text-t3 leading-relaxed">还没有沉淀。确认记录后，素材与知识会出现在这里。</p>
    <button onclick="openSub('pending')" class="press mt-2.5 h-8 px-3 bg-mist text-brand text-[11px] rounded-md">去待整理</button>`;
  return `<div class="space-y-1.5">${items.map(x => `<button onclick="${x.act}" class="press w-full flex items-center gap-2 py-1.5 text-left">
    <span class="text-[9px] px-1.5 py-0.5 rounded bg-subbg text-t3 shrink-0">${x.kind}</span>
    <span class="text-[11px] text-t2 flex-1 truncate">${esc(x.title)}</span>
    <span class="text-[10px] text-t3 shrink-0">${esc(x.sub)}</span>
  </button>`).join('')}</div>`;
}

/* =========================================================
   实习档案总览
   ========================================================= */
let archFilter = '全部';
SUB['archive'] = {
  onOpen(){ archFilter = '全部'; },
  title:'实习档案',
  actions(){ return `<button onclick="openSub('archiveForm')" class="press w-8 h-8 flex items-center justify-center text-brand text-[20px] leading-none">+</button>`; },
  body(){
    const list = DB.internships.filter(i => archFilter === '全部' || i.status === archFilter);
    return `<div class="p-4">
      <div class="flex gap-2 mb-3">
        ${['全部','进行中','已结束'].map(f => `<button onclick="archFilter='${f}';renderSub()" class="press text-[11px] px-2.5 py-1.5 rounded-md border ${archFilter===f?'bg-brand text-white border-brand font-medium':'bg-card text-t2 border-line'}">${f}</button>`).join('')}
      </div>
      ${list.length ? `<div class="space-y-2.5">${list.map(archCard).join('')}</div>` :
        emptyBox(I.brief, DB.internships.length ? '该状态下没有档案' : '还没有实习档案', DB.internships.length ? '换个筛选条件看看。' : '添加公司、岗位与时间，记录就能按实习归档。', DB.internships.length ? '' : '新建实习档案', "openSub('archiveForm')")}
      <p class="text-[10px] text-t3 text-center mt-4 leading-relaxed">档案只保存在本机，可随时编辑或删除<br>删除档案不会删除关联记录</p>
    </div>`;
  }
};
function archCard(i){
  const recs = DB.records.filter(r => r.internshipId === i.id);
  const days = daysBetween(i.start, i.end || iso());
  return `<div class="bg-card border border-line rounded-xl shadow-card p-4">
    <button onclick="openSub('archiveDetail','${i.id}')" class="press w-full text-left">
      <div class="flex items-start gap-3">
        <span class="w-10 h-10 rounded-xl grad-soft text-brand flex items-center justify-center text-[14px] font-semibold shrink-0">${esc(i.company.slice(0,1))}</span>
        <div class="min-w-0 flex-1">
          <p class="text-[14px] font-medium text-t1 truncate">${esc(i.company)}</p>
          <p class="text-[11px] text-t3 mt-1 truncate">${esc(i.dept || '未填写部门')} · ${esc(i.role || '未填写岗位')}</p>
          <p class="text-[10px] text-t3 mt-1">${esc(i.start || '—')} 至 ${esc(i.end || '—')} · ${days} 天 · ${recs.length} 条记录</p>
        </div>
        <span class="text-[10px] px-1.5 py-0.5 rounded shrink-0 ${i.status==='进行中'?'bg-mist text-brand':'bg-subbg text-t3'}">${esc(i.status)}</span>
      </div>
    </button>
    <div class="flex gap-2 mt-3">
      <button onclick="openSub('archiveDetail','${i.id}')" class="press flex-1 h-8 bg-mist text-brand text-[11px] rounded-md">查看详情</button>
      <button onclick="openSub('archiveForm','${i.id}')" class="press h-8 px-2.5 border border-line rounded-md text-[11px] text-t2">编辑</button>
      <button onclick="toggleInternshipStatus('${i.id}')" class="press h-8 px-2.5 border border-line rounded-md text-[11px] text-t2">${i.status==='进行中'?'结束实习':'标记进行中'}</button>
      <button onclick="delInternshipFromList('${i.id}')" class="press w-8 h-8 border border-line rounded-md text-[12px] text-t3">✕</button>
    </div>
  </div>`;
}
function toggleInternshipStatus(id){
  const it = DB.internships.find(x => x.id === id);
  if(!it) return;
  if(it.status === '进行中'){ it.status = '已结束'; }
  else {
    DB.internships.forEach(x => { if(x.status === '进行中') x.status = '已结束'; });
    it.status = '进行中';
  }
  saveDB(); refresh(); toast(it.status === '进行中' ? '已标记为进行中' : '已结束这份实习');
}
function delInternshipFromList(id){
  ask('删除这份实习档案？', '关联记录会保留，但不再归属该实习。', '删除', () => {
    DB.internships = DB.internships.filter(x => x.id !== id);
    saveDB(); refresh(); toast('已删除实习档案');
  }, true);
}

/* =========================================================
   全局搜索
   ========================================================= */
let gSearch = '';
SUB['search'] = {
  onOpen(){ gSearch = ''; },
  title:'搜索',
  body(){
    return `<div class="p-4">
      <div class="relative mb-4">
        <input id="gSearchInput" value="${esc(gSearch)}" oninput="gSearch=this.value;renderSearchResults()" placeholder="搜索记录、素材、知识、报告…" class="w-full h-11 bg-card rounded-xl pl-10 pr-3 text-[13px] outline-none border border-line focus:border-lteal shadow-card">
        <svg class="w-4 h-4 text-t3 absolute left-3.5 top-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.5-3.5"/></svg>
      </div>
      <div id="searchResults"></div>
    </div>`;
  },
  after(){ renderSearchResults(); }
};
function renderSearchResults(){
  const box = $('searchResults');
  if(!box) return;
  const kw = gSearch.trim().toLowerCase();
  if(!kw){
    const total = DB.records.length + DB.materials.length + DB.knowledge.length + DB.reports.length + DB.interviews.length;
    box.innerHTML = `<div class="text-center py-10">
      <p class="text-[12px] text-t2">输入关键词，搜索你的全部内容</p>
      <p class="text-[10px] text-t3 mt-1">共 ${total} 项内容可检索</p>
      <div class="flex gap-1.5 flex-wrap justify-center mt-3">
        ${['证据','合同','周报','商标'].map(k => `<button onclick="gSearch='${k}';$('gSearchInput').value='${k}';renderSearchResults()" class="press text-[10px] px-2.5 py-1.5 rounded-full bg-white border border-line text-t2">${k}</button>`).join('')}
      </div>
    </div>`;
    return;
  }
  const hit = t => String(t || '').toLowerCase().includes(kw);
  const recs = DB.records.filter(r => hit(r.text) || hit(r.summary) || hit((r.tags||'').join('')) || (r.ai && (hit(r.ai.situation) || hit(r.ai.task) || hit(r.ai.action) || hit(r.ai.result))));
  const mats = DB.materials.filter(m => hit(m.title) || hit(m.situation) || hit(m.task) || hit(m.action) || hit(m.result) || hit((m.ability||[]).join('')));
  const knows = DB.knowledge.filter(k => hit(k.title) || hit(k.body) || hit((k.tags||[]).join('')));
  const reps = DB.reports.filter(r => hit(r.period) || hit(r.content));
  const ivs = DB.interviews.filter(i => hit(i.company) || hit(i.role) || hit(i.jd));
  const total = recs.length + mats.length + knows.length + reps.length + ivs.length;
  if(!total){ box.innerHTML = `<div class="py-12 text-center"><p class="text-[12px] text-t2">没有找到「${esc(gSearch)}」</p><p class="text-[10px] text-t3 mt-1">换个关键词，或先记录一些内容</p></div>`; return; }
  const block = (title, arr, render) => arr.length ? `<div class="mb-4">
    <div class="flex items-center gap-2 mb-2"><p class="text-[11px] font-medium text-t1">${title}</p><span class="text-[10px] text-t3">${arr.length}</span><div class="flex-1 h-px bg-line"></div></div>
    <div class="space-y-1.5">${arr.slice(0,5).map(render).join('')}</div>
  </div>` : '';
  box.innerHTML = `<p class="text-[10px] text-t3 mb-3">找到 ${total} 条结果</p>
    ${block('记录', recs, r => `<button onclick="openRecord('${r.id}')" class="press w-full text-left bg-card border border-line rounded-lg p-3">
      <p class="text-[12px] text-t1 truncate">${esc((r.ai && r.ai.task) || r.summary || r.text)}</p>
      <p class="text-[10px] text-t3 mt-1">${fmtDate(r.date)} · ${esc(r.status)}</p></button>`)}
    ${block('简历素材', mats, m => `<button onclick="openMaterialQuick('${m.id}')" class="press w-full text-left bg-card border border-line rounded-lg p-3">
      <p class="text-[12px] text-t1 truncate">${esc(m.title)}</p>
      <p class="text-[10px] text-t3 mt-1">${esc(m.status)} · ${esc((m.ability||[]).join('、') || '无能力标签')}</p></button>`)}
    ${block('知识库', knows, k => `<button onclick="openKnowledge('${k.id}')" class="press w-full text-left bg-card border border-line rounded-lg p-3">
      <p class="text-[12px] text-t1 truncate">${esc(k.title)}</p>
      <p class="text-[10px] text-t3 mt-1">${esc(k.cat)}</p></button>`)}
    ${block('报告', reps, r => `<button onclick="viewReport('${r.id}')" class="press w-full text-left bg-card border border-line rounded-lg p-3">
      <p class="text-[12px] text-t1 truncate">${esc(r.period)}</p>
      <p class="text-[10px] text-t3 mt-1">${esc(r.content.slice(0,40))}…</p></button>`)}
    ${block('目标岗位', ivs, i => `<button onclick="openSub('interview')" class="press w-full text-left bg-card border border-line rounded-lg p-3">
      <p class="text-[12px] text-t1 truncate">${esc(i.company || '未填写公司')} · ${esc(i.role || '未填写岗位')}</p>
      <p class="text-[10px] text-t3 mt-1">${esc(i.jd.slice(0,40))}…</p></button>`)}`;
}
function openMaterialQuick(id){
  const m = DB.materials.find(x => x.id === id);
  if(!m) return;
  openSheet(m.title, `<div class="p-4 space-y-2">
    <div class="flex items-center gap-2">
      <span class="text-[10px] px-1.5 py-0.5 rounded ${m.status==='已确认'?'bg-mist text-brand':'bg-[#E8F4F6] text-[#2F7F8C]'}">${esc(m.status)}</span>
      ${(m.ability||[]).map(a => `<span class="text-[10px] text-t3 bg-subbg px-1.5 py-0.5 rounded">${esc(a)}</span>`).join('')}
    </div>
    ${[['情境 S',m.situation],['任务 T',m.task],['行动 A',m.action],['结果 R',m.result],['数据依据',m.data]].map(([k,v]) => v ? `<div class="bg-card border border-line rounded-lg p-2.5"><p class="text-[10px] text-t3">${k}</p><p class="text-[12px] text-t2 mt-0.5 leading-relaxed">${esc(v)}</p></div>` : '').join('')}
  </div>`, `<div class="p-3 flex gap-2">
    <button onclick="copyText(materialText('${id}'))" class="press flex-1 h-10 border border-line bg-white text-[12px] text-t2 rounded-lg">复制文案</button>
    <button onclick="closeSheet();openSub('resume')" class="press flex-1 h-10 bg-brand text-white text-[13px] rounded-lg">打开素材库</button>
  </div>`);
}
</script>

</body>
